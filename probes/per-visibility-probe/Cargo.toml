[package]
name = "per-visibility-probe"
version = "0.1.0"
description = "Experiment: does a PER permission gate reads only, or execution too? Not product code."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "per_visibility_probe"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "access-control"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
