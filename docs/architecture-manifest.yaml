schema_version: "1"
application:
  id: "vinct"
  name: "VINCT"
  goal: "Binding mutual aid for protocols sharing critical dependencies"
  network: "devnet"

requirements:
  privacy: "private"
  settlement_guarantee: "Every required base-layer effect must be independently observed before settlement"
  max_uncommitted_seconds: null
  latency_target_ms: null
  throughput_target_tps: null

products:
  - id: "per"
    purpose: "Protected incident state and sealed attestations"
  - id: "er"
    purpose: "Low-latency shared state and delegated account lifecycle"
  - id: "magic_actions"
    purpose: "Commit-linked base-layer action cohort"
  - id: "cranks"
    purpose: "Incident expiry"

actors:
  - id: "steward"
    authority: "formation only"
  - id: "protocol_authority"
    authority: "owns and arms local sovereign adapter"
  - id: "responder"
    authority: "opens incidents and submits one sealed attestation"
  - id: "observer"
    authority: "read-only public lifecycle"
  - id: "reconciler"
    authority: "classifies delivery, cannot execute silently"

accounts:
  - id: "covenant"
    owner_program: "vinct_core"
    derivation: "pda"
    authority: "ratification authorities"
    created_on: "base"
    persistence: "base-settled"
    er_access: "none"
    delegated: false
    delegation_group: "none"
    privacy: "public"
    commit_policy: "none"
    undelegate_policy: "none"
    close_policy: "expire or supersede"
    funding_owner: "steward"
  - id: "incident_state"
    owner_program: "vinct_core"
    derivation: "pda"
    authority: "program and PER permission authority"
    created_on: "base"
    persistence: "base-settled after scrub"
    er_access: "write"
    delegated: true
    delegation_group: "incident"
    privacy: "private"
    commit_policy: "terminal scrub-and-commit only"
    undelegate_policy: "after permission close and zeroization verification"
    close_policy: "none"
    funding_owner: "circle sponsor"
  - id: "ephemeral_permission"
    owner_program: "permission program"
    derivation: "sdk-defined"
    authority: "trusted permission authority"
    created_on: "er"
    persistence: "er-only"
    er_access: "write"
    delegated: false
    delegation_group: "incident"
    privacy: "private"
    commit_policy: "none"
    undelegate_policy: "none"
    close_policy: "close before incident undelegation"
    funding_owner: "delegated incident PDA or configured payer"
  - id: "adapter_capability"
    owner_program: "vinct_adapter"
    derivation: "pda"
    authority: "protocol authority"
    created_on: "base"
    persistence: "base-settled"
    er_access: "read"
    delegated: false
    delegation_group: "none"
    privacy: "public"
    commit_policy: "none"
    undelegate_policy: "none"
    close_policy: "revoke or expire"
    funding_owner: "protocol"
  - id: "adapter_receipt"
    owner_program: "vinct_adapter"
    derivation: "pda"
    authority: "adapter program"
    created_on: "base"
    persistence: "base-settled"
    er_access: "none"
    delegated: false
    delegation_group: "none"
    privacy: "public"
    commit_policy: "none"
    undelegate_policy: "none"
    close_policy: "immutable"
    funding_owner: "Magic Action escrow"
  - id: "settlement_receipt"
    owner_program: "vinct_core"
    derivation: "pda"
    authority: "action handler"
    created_on: "base"
    persistence: "base-settled"
    er_access: "none"
    delegated: false
    delegation_group: "none"
    privacy: "public"
    commit_policy: "none"
    undelegate_policy: "none"
    close_policy: "immutable"
    funding_owner: "Magic Action escrow"

routing:
  router_discovery_required: true
  allow_static_er_endpoint: false
  compatibility_checks:
    - "all writable delegated accounts resolve to the same compatible ER"
    - "base owner, router status, and ER owner agree"
    - "fresh blockhash obtained from the destination runtime"

settlement:
  strategy: "terminal"
  triggers:
    - "threshold certificate after private-field zeroization"
    - "incident expiry after private-field zeroization"
  terminal_undelegation_actor: "configured incident lifecycle authority"
  magic_actions:
    - "three sovereign adapter actions"
    - "one final settlement receipt action"
  commit_sponsor: "verify current quota and fee-vault path in Phase 0"
  fee_vault: null
  delegated_fee_payer: null
  recovery_path: "observe every expected effect, classify, create governed recovery with a new operation ID"

external_dependencies:
  - "MagicBlock base RPC"
  - "MagicBlock Router"
  - "router-resolved TEE-backed PER endpoint"
  - "Magic Program committor and action service"
  - "MagicBlock crank scheduler"
  - "Solana Devnet"

open_questions:
  - "How a cached ER program clone is refreshed, and how long it persists after a base-layer upgrade. Routing to a different validator is a workaround, not an answer. See docs/decision-log.md D-0030."
  - "Expected TEE workload measurement allowlist"
  - "Protocol operator acceptance of unarmed and armed sovereign adapters"
  # Raised by the Phase 0 probe; see docs/decision-log.md D-0009 and D-0008.
  - "Whether the TypeScript SDK 0.14.3 and Rust SDK 0.16.2 pairing holds at runtime for permission and intent encoding"
  - "Which crank call path to use: raw MagicBlockInstruction::ScheduleTask bincode, or the SDK ScheduleCrankCpi driven from remaining_accounts"

canonical_commitments:
  # Corrected in Phase 1. See docs/decision-log.md D-0012.
  operation_id:
    derivation: "sha256(domain || cluster_genesis_hash || covenant || circle_epoch_le64 || incident_id_le64 || policy_id || member_set_hash || action_bundle_template_hash || certificate_nonce_le64)"
    domain: "sha256(\"VINCT_OPERATION_V1\")"
    note: "Takes the policy's registered action-template hash, not the concrete per-incident bundle hash. PRD 12.4 took the concrete bundle hash while PRD 12.3 places the operation ID inside that bundle, and receipt PDAs seeded by the operation ID appear in its account metas, so neither value could be computed first."
    supersedes: "PRD section 12.4"
  concrete_bundle_binding:
    carrier: "CertificateV1.action_bundle_hash"
    note: "Binding to the exact per-incident bundle is enforced one level up, on the certificate, and checked by the adapter alongside the operation ID."
  account_meta_order: "exact Solana instruction order, never sorted anywhere"
  set_orderings:
    member_set: "ascending by member address; an out-of-order set is rejected on decode, never sorted"
    policy_set: "ascending by policy_id"
    adapter_set: "ascending by capability address then version"
  template_account_roles:
    - "fixed"
    - "adapter_receipt"
    - "settlement_receipt"
    - "certificate"
  capability_commitment: "action_template_hash, over the template's shape. The two operation-derived slots contribute their role and flags and no address, so one arming serves every valid incident under the same covenant, policy, and epoch. See docs/decision-log.md D-0048 and D-0050."
  capability_lifetime:
    installed: "before any incident exists"
    reusable: "for any valid incident under the same covenant, policy, and epoch"
    bounded_by: ["adapter version", "effect limit", "validity window"]
    revocable: "by its own protocol authority, at any time, including after a certificate is issued"
    replay_protection: "per operation, by a receipt seeded from the operation and the capability"
  execute_bounded_action_accounts:
    static: ["capability", "protocol_state", "adapter_signer", "target_program"]
    dynamic: ["certificate", "adapter_receipt"]
    dispatcher_injected: ["escrow_auth", "escrow"]
    note: "Derived from the real instruction context, not from a description of it. See D-0049."
  dynamic_account_derivation: "the adapter re-derives both dynamic accounts itself. The certificate from [CERTIFICATE_SEED, operation_id] under the capability's named core program; the receipt from its own seeds plus its stored operation and capability."
  template_account_roles_note: "Operation-derived slots declare a role instead of an address, because receipt PDAs depend on the operation ID. The adapter re-derives the expected address from the operation ID rather than trusting a supplied one. See docs/decision-log.md D-0015."

quarantine_semantics:
  # Corrected in Phase 1 after a property test found the hole. See docs/decision-log.md D-0013.
  approval: "discarded; a possibly-compromised key must not authorise an action"
  rejection: "still counts toward the rejection ceiling; erasing it would let the quarantine authority unblock an action the covenant had refused"
  superseded_record: "never counts either way"
  threshold: "never lowered"
  consequence: "quarantine can make certification impossible, never easier"

resolved_questions:
  - question: "Exact compatible Anchor and TypeScript version line after Phase 0 probe"
    resolution: "anchor-lang 1.0.2 with ephemeral-rollups-sdk 0.16.2 features [anchor, access-control]; Anchor CLI 1.0.2; Solana CLI 3.1.9 with platform tools v1.52; Rust 1.89.0; TypeScript client on @coral-xyz/anchor 0.32.1 and @magicblock-labs/ephemeral-rollups-sdk 0.14.3 over @solana/web3.js v1."
    evidence: "docs/source-lock.md; artifacts/source-lock/version-report.json"
  - question: "Whether router getDelegationStatus returns an fqdn for a delegated account"
    resolution: "It does. Against a genuinely delegated account on Devnet the response is {delegationRecord, fqdn, isDelegated} and the resolver reached https://devnet-as.magicblock.app/ through it. The Phase 0 observation was made against an undelegated account, where there is no endpoint to report. PRD section 10 is correct as written."
    evidence: "docs/decision-log.md D-0024; packages/client/src/routing.ts"
  - question: "Exact target-environment grouping of all BaseActions in one TransactionStrategy"
    resolution: "All four shared one strategy on the local committor. A single failing BaseAction removed every action in the cohort and the committor retried the commit alone, producing COMMIT_WITHOUT_ACTIONS rather than PARTIAL_OBSERVATION. Inferred from all four disappearing together; the committor does not expose its grouping directly. Not yet observed on Devnet."
    evidence: "artifacts/local-stack/committor-behaviour.json; docs/decision-log.md D-0027"
  - question: "How adapter and settlement receipt accounts are created given the #[action] escrow_auth constraint"
    resolution: "Receipt PDAs are seeded by the operation ID and created on base before the intent is scheduled. Templates name them by role, not address, and the adapter re-derives the expected address from the operation ID. Phase 0 preferred option A."
    evidence: "docs/decision-log.md D-0015; crates/vinct-types/src/action.rs; crates/vinct-types/tests/canonical_hashes.rs"

phase_0_constraints:
  # Constrains the Phase 3 receipt design. See docs/decision-log.md D-0008.
  - "The #[action] macro appends escrow_auth as a non-mutable UncheckedAccount, so a Magic Action target cannot init its own accounts. adapter_receipt and settlement_receipt PDAs must exist on base before the action is scheduled, or be created by a payer other than escrow_auth."
  # Constrains every local-stack run. See docs/decision-log.md D-0007.
  - "The local stack requires the ephemeral validator identity funded to at least 5 SOL on base; the packaged dump funds 0.0534 SOL."

privacy_boundary:
  # The property: a member learns their own submission was accepted and nothing else.
  # Full narrative in docs/privacy-boundary.md.
  sealed_quorum: "holds by construction, not by care. See docs/decision-log.md D-0042 and D-0043."
  account_split:
    incident_core:
      permission: none
      readable_by: "anyone"
      holds: "covenant, policy, threshold, deadline, status, member count, and the aggregate counts that only exist once the outcome is settled"
    incident_claim:
      permission: "the incident's member set"
      readable_by: "members"
      holds: "the responder's raw claim, notes, and observation window"
    member_attestation:
      permission: "that one member"
      readable_by: "that member alone, not the opener, not the payer, not the other members"
      holds: "that member's decision, nonce, and submission slot"
      created: "for every member when the incident opens, so existence says nothing about who has responded"
    live_tally: "there is none. Certification is handed every attestation at once and counts in memory."
  why_it_works: "A PER permission gates reading an account, not touching it. A member's transaction writes their own ballot while the program reads every ballot, and that member still cannot read any but their own. Proven in artifacts/devnet/per-visibility-experiment-latest.json."
  no_commit_reveal: "An all-member reveal round would turn k-of-n into n-of-n liveness. Certification needs every attestation account passed, not every member to have acted, so a silent member never stalls it."
  locked_claims:
    # The strong version of the product claim. Each line is asserted by a named test.
    - "individual attestations are hidden from other voting members"
    - "individual attestations are hidden from the incident opener unless the opener is that ballot's member"
    - "the exact live approval count is not stored anywhere"
    - "the exact live rejection count is not stored anywhere"
    - "certification evaluates the private ballots in memory"
    - "ballot existence reveals nothing, because every eligible ballot account is created at incident open"
    - "k-of-n certification does not require all members to act"
    - "no reveal round exists"
  platform_insight: "On the current MagicBlock runtime, for the VINCT account flow that was tested, query authorization and program execution authorization are separate: a transaction can mutate an account its sender cannot read. Established by experiment against one attested Devnet rollup and the local reference stack. It is observed runtime behaviour, not a documented protocol guarantee, and should be re-checked after a validator upgrade."

certification:
  # The ballot set is reconstructed, not trusted. See docs/decision-log.md D-0044.
  frozen_at_open:
    member_list: "passed to open_incident, not a digest of it; the program computes the commitment itself"
    ordering: "strictly ascending by member address; an out-of-order or repeating list is rejected, never sorted"
    ballot_existence: "a ballot account must already exist at the canonical address for every member before the set is frozen"
  checked_at_certification:
    - "exact account count equals the frozen member count"
    - "every ballot is owned by vinct_core"
    - "every ballot carries the current schema version"
    - "every ballot is bound to this incident's core, which fixes covenant, epoch, policy, and snapshot"
    - "every ballot lives at its canonical address derived from the incident and the member it names"
    - "members arrive strictly ascending, which also forbids duplicates"
    - "the commitment recomputed over the supplied members equals the one frozen at open"
    - "every ballot is in a state that may be counted; a scrubbed ballot is refused"
    - "the core is seed-constrained, so one incident's ballots cannot be settled against another's threshold"
  counting:
    unsubmitted: "counts as no decision, never as a rejection"
    superseded: "impossible to present; a resubmission overwrites in place under a strictly increasing nonce"
    quarantined: "approval discarded, rejection retained, threshold never lowered"
    order_independence: "the tally is a sum, so order cannot change the result; a non-canonical order is refused before it is counted"
  terminal_outcomes: ["CertifiedPendingSettlement", "RejectedByThreshold", "Expired"]
  rejected_is_named_at_the_deadline: "never the moment the blocking rejection lands, so the timing is not observable. See D-0045."
  reference_parity: "all 512 three-member cases agree with crates/vinct-reference: four choices per member, every quarantine subset, both sides of the deadline."

certification_side_channels:
  # Narrow by design. VINCT does not claim constant time or traffic-analysis resistance.
  claim: "VINCT does not expose exact live quorum progress through its own public state, errors, logs, events, or account lifecycle."
  checked:
    error_code: "every premature certification refuses with IncidentNotTerminal, whatever the tally"
    public_state: "the public core's data, length, and lamports are identical at zero, one, and two approvals"
    acknowledgement: "a member's submission returns no data and logs identically however the quorum stands"
    account_lifecycle: "no account is created, closed, or resized as the tally moves"
    events: "nothing is emitted while collecting; certification emits one event carrying the aggregate that is public by then"
    compute_units: "submitting costs the same whatever the tally; quarantining costs the same whether or not the member had voted"
  not_claimed:
    - "constant-time execution"
    - "resistance to an observer correlating transaction traffic"
    - "concealment of an incident's existence, its deadline, or its member count"
  permission_member_flags: 0
  permission_member_flags_note: "No visibility flags are granted. Membership alone allows interaction. A consequence is that the rollup withholds transaction logs even from the sender, so refusal reasons are resolved from error codes against the IDL. See docs/decision-log.md D-0034."
  delegation_authority: "the opening responder signs delegate_incident, delegate_claim, and delegate_attestation, checked by hand because #[delegate] needs the account untyped. The caller chooses the validator, so this decides which rollup the private material lands on. See D-0041."
  permission_authority:
    claim_create_and_update: "the opening responder signs; both decide who may read the evidence"
    attestation_create: "no member list argument at all; the program reads the single member off the account"
    close: "no signer, gated on the scrub; requiring one would let a responder strand a scrubbed account inside the rollup"
    note: "The permission program accepts only the permissioned PDA as a permission's authority. That is a separate question from who may ask vinct_core to make the call. See D-0039."
  protected_field_classes:
    - "private_claim"
    - "private_notes"
    - "private_observation_start"
    - "private_observation_end"
    - "attestation decision"
    - "attestation submission nonce"
  zeroization_gate:
    guards:
      - "commit_incident"
      - "release_incident"
      - "close_claim_permission"
      - "close_attestation_permission"
    per_account: "every private account is checked on its own bytes; one unscrubbed ballot blocks the whole release"
    ordering: "bytes first, flag second; a program that sets private_fields_zeroized without scrubbing is caught by the byte check"
    account_handling: "exit paths hold their accounts as UncheckedAccount and decode by hand, because Anchor's typed write-back lands after commit_and_undelegate has taken the account. See D-0029."
  certification:
    permissionless: true
    uniform_refusal: "every non-terminal refusal is IncidentNotTerminal whatever the reason, so a caller cannot distinguish too-few-approvals from too-many-rejections"
    no_early_failure: "an incident that cannot reach its threshold waits for its deadline, so the moment a blocking rejection lands is not observable"
    leaked_bit: "whether the incident has certified, which is the public status anyway"
  documented_limitations:
    - "Existence and activity remain visible. Accounts are created, delegated, and undelegated in public. No traffic-analysis resistance is claimed."
    - "The TDX quote check does not compare MRTD or RTMR against an expected workload allowlist, so it does not establish which code runs inside the enclave."
    - "Browser storage surfaces are not scanned by the Phase 4 run because no browser is involved. Phase 7 covers them."

runtime_freshness:
  # The operational answer to D-0030's stale ER program clone.
  fingerprint_source: "programs/vinct-core/build.rs, SHA-256 over every .rs file in the crate with paths relative to the source root"
  exposed_by: "the build_info instruction, through set_return_data and a log line"
  compared: ["the checkout", "the base-layer deployment", "the selected rollup"]
  verdicts: ["FRESH", "STALE_ER", "STALE_BASE", "UNDETERMINED"]
  on_failure: "try the next attested endpoint; if none is fresh, write BLOCKED_STALE_RUNTIME and collect no artifacts"
  undetermined_is_not_a_pass: "a runtime that does not answer build_info has not said it is current"
  cost: "simulation only, so the gate cannot be skipped for being expensive"

tee_selection:
  method: "ask every router-advertised endpoint for a TDX quote over a fresh 64-byte challenge and verify the quote's report data is that challenge"
  helper: "verifyTeeRpcIntegrity from @magicblock-labs/ephemeral-rollups-sdk"
  never: "no region name, country code, or hostname takes part in the decision"
  observed: "one of four Devnet routes answered"
  establishes: "a genuine quote bound to this challenge, from hardware Intel's chain vouches for"
  does_not_establish: "which code runs inside the enclave; traffic-analysis resistance; concealment of an incident's existence"
