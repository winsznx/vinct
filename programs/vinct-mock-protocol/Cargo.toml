[package]
name = "vinct-mock-protocol"
version = "0.1.0"
description = "VINCT vinct-mock-protocol program"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "vinct_mock_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
