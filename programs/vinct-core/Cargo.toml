[package]
name = "vinct-core"
version = "0.1.0"
description = "VINCT vinct-core program"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "vinct_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "=0.16.2", features = ["anchor", "access-control"] }
sha2 = "=0.10.9"
# The crank surface. Same versions the Phase 0 probe compiled and the Phase 6 probe verified
# against a running validator; see docs/source-lock.md and docs/decision-log.md D-0059.
magicblock-magic-program-api = { version = "=0.10.1", default-features = false }
bincode = "=1.3.3"
# The canonical digests, shared with the reference model and the standalone verifier rather
# than reimplemented. An operation ID computed three ways is three chances to disagree.
vinct-types = { path = "../../crates/vinct-types" }

[build-dependencies]
sha2 = "=0.10.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
