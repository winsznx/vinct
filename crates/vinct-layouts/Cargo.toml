[package]
name = "vinct-layouts"
version = "0.1.0"
description = "Emits canonical account-layout vectors from the programs' own Rust types. Dev tooling, never deployed."
edition = "2021"
publish = false

# Depends on the programs as libraries on purpose, and is the only crate that does. The
# vectors have to come from the same structs the programs write, or they would be a second
# opinion about the layout rather than a record of it.
[[bin]]
name = "gen-account-vectors"
path = "src/main.rs"

[dependencies]
anchor-lang = "=1.0.2"
vinct-core = { path = "../../programs/vinct-core" }
vinct-adapter = { path = "../../programs/vinct-adapter" }
vinct-mock-protocol = { path = "../../programs/vinct-mock-protocol" }
serde_json = "=1.0.151"
hex = "=0.4.3"
sha2 = "=0.10.9"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
