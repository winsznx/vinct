[package]
name = "vinct-reference"
version = "0.1.0"
description = "Executable reference model for VINCT. The specification production code is checked against."
edition = "2021"
publish = false

[dependencies]
vinct-types = { path = "../vinct-types" }
borsh = { version = "=1.8.0", features = ["derive"] }
hex = { version = "=0.4.3", optional = true }
serde_json = { version = "=1.0.151", optional = true }

[dev-dependencies]
proptest = "=1.11.0"
hex = "=0.4.3"
serde_json = "=1.0.151"

[features]
default = []
# Enables the canonical vector generator. Kept behind a feature so the reference model
# itself never depends on a JSON serialiser.
vectors = ["dep:hex", "dep:serde_json"]

[[bin]]
name = "gen-vectors"
path = "src/bin/gen_vectors.rs"
required-features = ["vectors"]

[lints.rust]
missing_docs = "warn"
